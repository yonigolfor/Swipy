[versions]
# Core & Build Plugins
agp = "8.13.0"
kotlin = "2.0.0"                       # Compose Compiler is now the in-tree K2 plugin — see [plugins] below
ksp = "2.0.0-1.0.24"                   # Kotlin Symbol Processing — used for Hilt's KSP compiler (2.48+), not kapt

# SDK levels — see android/CLAUDE.md "Media & Storage Operations" for why minSdk is 29
# (Scoped Storage baseline: createTrashRequest/createDeleteRequest exist from API 30, but
# the legacy pre-Scoped-Storage delete branch can be omitted entirely rather than kept as dead code)
# compileSdk/targetSdk bumped to 36 (Android 16) — Google Play requires targetSdk >= 36 for
# new app submissions as of the 2026 policy cycle (was pinned at 34 pre-upload; see git history
# / android/TODO.md item 11 for that original AGP-8.5.1-ceiling rationale, now obsolete since
# AGP was bumped to 8.13.0 alongside this, which officially supports up to API 36.1).
compileSdk = "36"
minSdk = "29"
targetSdk = "36"

# UI & Image Rendering
composeBom = "2024.06.00"
coilCompose = "2.6.0"
navigationCompose = "2.7.7"

# Architecture & Async
coroutines = "1.8.1"
hilt = "2.51.1"
hiltNavigationCompose = "1.2.0"        # bridges hiltViewModel() into Navigation Compose destinations
lifecycle = "2.8.2"

# Baseline platform plumbing (:app needs these regardless of feature-module deps)
coreKtx = "1.13.1"
activityCompose = "1.9.0"

# core/model — see android/CLAUDE.md "Gesture Engine" ImmutableList stability rule
kotlinxCollectionsImmutable = "0.3.7"

# Persistence (:data:datastore) — UserDefaults analogue, see android/CLAUDE.md "Persistence"
datastorePreferences = "1.1.1"
kotlinxSerializationJson = "1.7.1"

# Video — see android/CLAUDE.md "Video via Media3 ExoPlayer, pooled"
media3 = "1.3.1"

# Billing (:data:billing) — StoreKit 2 analogue, see android/CLAUDE.md "Core Tech Stack".
# Bumped 7.1.1 -> 8.0.0 per Play Console's "latest monetization features" requirement — a
# drop-in bump per Google's official 7->8 migration guide; BillingManager.kt already used only
# the modern KTX APIs (queryProductDetails, queryPurchasesAsync(QueryPurchasesParams), the
# parameterized enablePendingPurchases(PendingPurchasesParams)) that survive unchanged, none of
# the removed legacy ones (querySkuDetailsAsync, no-arg enablePendingPurchases, raw-skuType
# queryPurchasesAsync, setOldSkuPurchaseToken/setReplaceProrationMode) — confirmed by reading
# the file before bumping, not assumed.
billing = "8.0.0"

# Notifications (:core:notifications) — periodic background checks + Hilt-injected Workers
workManager = "2.9.1"
hiltWork = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# JSR-330 @Inject — used on :domain use-case constructors so Hilt can construct them
# once the app-level DI graph exists, without :domain depending on Hilt itself.
javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

android-billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]
